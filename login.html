<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Whisker and Wag</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#faf9f6] min-h-screen flex items-center justify-center px-4 py-6">

  <div class="w-full max-w-[1000px] grid grid-cols-1 md:grid-cols-2 bg-white rounded-[24px] overflow-hidden shadow-[0_20px_60px_rgba(0,0,0,0.1)] border border-black/5">

    <!-- LEFT -->
    <div class="bg-[#ffefe0] p-8 md:p-12 flex flex-col justify-center relative overflow-hidden min-h-[320px]">
      <h2 class="font-black text-[32px] md:text-[42px] leading-[0.85] uppercase">WHISKER<br>AND<br>WAG</h2>
      <p class="mt-4 text-[13px] text-black/60 max-w-[240px]">Login to continue your pet's happiness journey.</p>
      <div class="text-[120px] absolute -bottom-8 -right-6 opacity-20">🐾</div>
      <a href="index.html" class="mt-8 inline-flex w-fit text-[11px] uppercase tracking-widest border border-black/20 px-4 py-2 rounded-full hover:bg-black hover:text-white transition">← Back to Home</a>
    </div>

    <!-- RIGHT -->
    <div class="p-8 md:p-12 flex flex-col justify-center">
      <h3 class="font-bold text-[24px]">Welcome Back!</h3>
      <p class="text-[12px] text-black/50 mt-1 mb-8">Please enter your details</p>

      <form class="space-y-5" onsubmit="event.preventDefault(); alert('Login Successful! 🐶'); window.location.href='index.html';">
        <div>
          <label class="text-[11px] uppercase tracking-[2px] font-bold">Email Address</label>
          <input type="email" required placeholder="sree@example.com" class="w-full mt-2 border border-black/15 rounded-[12px] px-4 py-3.5 text-[14px] outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition">
        </div>
        <div>
          <label class="text-[11px] uppercase tracking-[2px] font-bold">Password</label>
          <input type="password" required placeholder="••••••••" class="w-full mt-2 border border-black/15 rounded-[12px] px-4 py-3.5 text-[14px] outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition">
        </div>

        <button type="submit" class="w-full bg-black text-white py-4 rounded-[12px] text-[12px] font-bold uppercase tracking-[2px] hover:bg-orange-500 transition-all active:scale-[0.98]">
          Login →
        </button>

        <p class="text-center text-[12px] text-black/50">Don't have an account? <a href="#" class="font-bold text-black underline hover:text-orange-500">Sign Up</a></p>
      </form>
    </div>

  </div>

</body>
</html>
